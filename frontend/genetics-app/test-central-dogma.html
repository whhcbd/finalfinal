<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Dogma Test</title>
  <style>
    body { font-family: Inter, sans-serif; padding: 20px; background: #f5f5f5; margin: 0; }
    .test-container { max-width: 900px; margin: 0 auto; }
    h1 { color: #111827; font-size: 1.5rem; margin-bottom: 24px; }
    .component-wrapper { background: white; border-radius: 12px; padding: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 24px; }
    .section-title { font-size: 0.875rem; color: #6b7280; margin: 0 0 8px 8px; }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>中心法则组件测试</h1>

    <p class="section-title">默认序列 ATCGATCG</p>
    <div class="component-wrapper">
      <central-dogma id="comp1"></central-dogma>
    </div>

    <p class="section-title">自定义序列 ATGCCC（含 AUG 起始密码子）</p>
    <div class="component-wrapper">
      <central-dogma id="comp2" dnaSequence="ATGCCC"></central-dogma>
    </div>
  </div>

  <script type="module">
    import '/src/index.ts';

    // 监听 a2ui-action 事件
    document.addEventListener('a2ui-action', (e) => {
      console.log('[a2ui-action]', e.detail);
    });
  </script>
</body>
</html>
